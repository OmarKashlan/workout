<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rolling Upper/Lower</title>
  <meta name="description" content="Offline workout log for the Rolling Upper/Lower Split.">
  <meta name="theme-color" content="#121418">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-plate="red">
  <main id="main"></main>

  <div id="timer" class="timer hidden" role="timer" aria-live="polite">
    <div class="t-ring">
      <svg viewBox="0 0 80 80" aria-hidden="true"><circle class="trk" cx="40" cy="40" r="34"/><circle class="val" cx="40" cy="40" r="34"/></svg>
      <span class="clock">0:00</span>
    </div>
    <div class="lbl grow"><b>Rest</b><span class="lbl-sub"></span></div>
    <button class="btn sm" data-t="add" aria-label="Add 15 seconds">+15 s</button>
    <button class="btn sm" data-t="skip">Skip</button>
  </div>

  <nav id="tabs" class="tabs" aria-label="Main"></nav>
  <div id="sheet-root"></div>
  <div id="cele-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p style="padding:16px">This app needs JavaScript turned on.</p></noscript>
  <script src="library.js"></script>
  <script src="program.js"></script>
  <script src="app.js"></script>
</body>
</html>
